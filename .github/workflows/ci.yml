name: Tests and Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m pip check
  windows-installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - run: python -m PyInstaller --noconfirm --windowed --onedir --name FromWebpConverter --icon assets/icon.ico --add-data "assets;assets" --paths src src/main.py
      - name: Build installer
        shell: pwsh
        run: |
          $appVersion = python -c "import sys; sys.path.insert(0, 'src'); import globalVariables; print(globalVariables.APP_VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$appVersion" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and launch smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $installer = Get-ChildItem dist/installer/*-Setup.exe | Select-Object -First 1
          $install = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $installedApp = Join-Path $env:LOCALAPPDATA 'Programs/FromWebpConverter/FromWebpConverter.exe'
          if (!(Test-Path $installedApp)) { throw 'Installed executable missing' }
          $appProcess = Start-Process $installedApp -PassThru
          Start-Sleep -Seconds 8
          if ($appProcess.HasExited) { throw "Application exited unexpectedly: $($appProcess.ExitCode)" }
          Stop-Process -Id $appProcess.Id
          $uninstaller = Join-Path (Split-Path $installedApp) 'unins000.exe'
          $uninstall = Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: dist/installer/*-Setup.exe
          if-no-files-found: error
